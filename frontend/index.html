<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Live Board</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Vazirmatn:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

  :root {
    --board-bg: #0b0e11;
    --panel-bg: #14181d;
    --panel-bg-2: #191e24;
    --flap-border: #2a313b;
    --row-border: #1c2128;
    --text-dim: #6b7480;
    --text: #cfd6de;
    --amber: #ffb020;
    --green: #33d17a;
    --red: #ff5c5c;
    --blue: #4da3ff;
    --sidebar-w: 240px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--board-bg);
    color: var(--text);
    font-family: 'Rajdhani', 'Vazirmatn', sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  /* ---------------- Sidebar ---------------- */

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--panel-bg);
    border-inline-end: 1px solid var(--flap-border);
    display: flex;
    flex-direction: column;
    transition: margin-inline-start 0.25s ease, min-width 0.25s ease, width 0.25s ease;
    overflow: hidden;
  }

  .sidebar.collapsed {
    margin-inline-start: calc(-1 * var(--sidebar-w));
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 16px;
    padding-inline-start: 56px;
    border-bottom: 1px solid var(--flap-border);
  }

  .sidebar-title {
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--amber);
    font-size: 14px;
    white-space: nowrap;
  }

  .nav-list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 14px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .nav-item:hover {
    background: var(--panel-bg-2);
    color: var(--text);
  }

  .nav-item.active {
    background: rgba(255,176,32,0.12);
    color: var(--amber);
  }

  .nav-item.board-link {
    border-radius: 0;
  }
  .nav-item.account-link {
    border-radius: 0;
  }
  .nav-item.fenefx-link {
    margin-bottom: 6px;
    border-bottom: 1px solid var(--flap-border);
    padding-bottom: 14px;
    border-radius: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .separate-badge {
    background: rgba(196,131,255,0.18);
    color: #c483ff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 5px;
    font-weight: 700;
    margin-inline-start: auto;
  }

  .nav-bias {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .nav-bias.bullish { background: rgba(51,209,122,0.15); color: var(--green); }
  .nav-bias.bearish { background: rgba(255,92,92,0.15); color: var(--red); }
  .nav-bias.neutral { background: rgba(107,116,128,0.2); color: var(--text-dim); }

  /* ---------------- Toggle button ---------------- */

  .sidebar-toggle {
    position: fixed;
    top: 16px;
    inset-inline-start: 16px;
    z-index: 50;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    color: var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    user-select: none;
  }

  /* ---------------- Main content ---------------- */

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 3vh 3vw 6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.4vh;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-size: clamp(13px, 1.5vw, 20px);
    font-weight: 600;
  }

  .header .title { color: var(--amber); font-weight: 700; }

  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 8px var(--red);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.live {
    background: var(--green); box-shadow: 0 0 10px var(--green);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ---------------- Board (table) view ---------------- */

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.4);
    width: min(1100px, 100%);
    overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; min-width: 640px; }

  thead th {
    text-align: left;
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--row-border);
  }
  thead th.num, tbody td.num { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--row-border); cursor: pointer; }
  tbody tr:hover { background: var(--panel-bg-2); }
  tbody tr:last-child { border-bottom: none; }

  td { padding: 12px 18px; font-family: 'Share Tech Mono', monospace; font-size: clamp(15px, 1.9vw, 21px); }
  td.symbol { font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 2px; color: var(--amber); font-size: clamp(14px, 1.6vw, 18px); }
  td.bid { color: var(--green); }
  td.ask { color: var(--red); }
  td.spread { color: var(--text-dim); font-size: clamp(13px, 1.4vw, 16px); }
  td.time { color: var(--text-dim); font-size: clamp(12px, 1.3vw, 15px); }

  td.flash-up { animation: flashGreen 0.6s ease; }
  td.flash-down { animation: flashRed 0.6s ease; }
  @keyframes flashGreen { 0% { background: rgba(51,209,122,0.25); } 100% { background: transparent; } }
  @keyframes flashRed { 0% { background: rgba(255,92,92,0.25); } 100% { background: transparent; } }

  .footer { color: var(--text-dim); font-size: 12px; letter-spacing: 2px; text-align: center; }

  .pnl-pos { color: var(--green) !important; }
  .pnl-neg { color: var(--red) !important; }

  .panel-title {
    margin: 0;
    padding: 16px 18px 8px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
  }
  .panel-title span { color: var(--amber); text-transform: none; letter-spacing: 0.5px; font-family: 'Share Tech Mono', monospace; }

  .trading-panel { padding: 16px 18px; }
  .trading-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    direction: ltr;
  }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--flap-border);
    border-radius: 999px;
    transition: background 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; bottom: 3px; background: var(--text);
    border-radius: 50%; transition: transform 0.2s;
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #0b0e11; }

  .trading-state-label { font-weight: 700; font-size: 13px; letter-spacing: 1px; }
  .trading-state-label.on { color: var(--green); }
  .trading-state-label.off { color: var(--text-dim); }

  .trading-risk { color: var(--text-dim); font-size: 13px; margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
  .trading-risk b { color: var(--amber); font-family: 'Share Tech Mono', monospace; }
  .lot-input {
    width: 80px;
    background: var(--panel-bg-2);
    border: 1px solid var(--flap-border);
    color: var(--amber);
    border-radius: 6px;
    padding: 5px 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }
  .lot-save-btn {
    background: rgba(255,176,32,0.14);
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .lot-save-btn:hover { background: rgba(255,176,32,0.25); }
  .lot-saved-msg { color: var(--green); font-size: 12px; }

  .trading-warning {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(255,92,92,0.1);
    border: 1px solid rgba(255,92,92,0.35);
    border-radius: 8px;
    color: var(--red);
    font-size: 13px;
    line-height: 1.7;
  }

  .trading-actions {
    margin-top: 12px;
    max-height: 160px;
    overflow-y: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 4px;
    direction: ltr;
    text-align: left;
  }

  /* ---------------- FeneFX AI panel ---------------- */

  .fenefx-select {
    background: var(--panel-bg-2);
    border: 1px solid var(--flap-border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: 'Rajdhani', sans-serif;
  }

  .provider-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 700;
  }
  .provider-badge.ok { background: rgba(51,209,122,0.15); color: var(--green); }
  .provider-badge.missing { background: rgba(255,92,92,0.15); color: var(--red); }

  .symbol-analyze-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .symbol-analyze-btn {
    background: var(--panel-bg-2);
    border: 1px solid var(--flap-border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .symbol-analyze-btn:hover:not(:disabled) { border-color: #c483ff; color: #c483ff; }
  .symbol-analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .progress-wrap {
    display: none;
    margin-top: 14px;
  }
  .progress-wrap.active { display: block; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    direction: ltr;
  }
  .progress-track {
    height: 10px;
    background: var(--panel-bg-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--flap-border);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c483ff, #ffb020);
    transition: width 0.3s ease;
    width: 0%;
  }

  /* ---------------- Detail (chart) view ---------------- */

  .detail {
    width: min(1200px, 100%);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .live-price-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    border-radius: 10px;
    padding: 10px 22px;
  }
  .live-price-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .live-price-item .lbl {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-dim);
  }
  .live-price-item.bid span:last-child { color: var(--green); }
  .live-price-item.ask span:last-child { color: var(--red); }
  .live-price-item.spread span:last-child { color: var(--text-dim); font-size: 15px; }
  .live-price-item.time span:last-child { color: var(--text-dim); font-size: 15px; }
  .live-price-item span:last-child.flash-up { animation: flashGreen 0.6s ease; }
  .live-price-item span:last-child.flash-down { animation: flashRed 0.6s ease; }

  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tf-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tf-btn {
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 7px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tf-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .tf-btn.active {
    background: rgba(255,176,32,0.14);
    color: var(--amber);
    border-color: var(--amber);
  }

  .badge {
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .badge b { color: var(--text); font-weight: 700; }
  .badge.bullish b { color: var(--green); }
  .badge.bearish b { color: var(--red); }
  .badge.neutral b { color: var(--text-dim); }
  .badge.kz b { color: var(--blue); }

  .chart-panel {
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 12px;
  }

  #chart { width: 100%; height: 460px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    padding: 10px 4px 2px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--panel-bg);
    border: 1px solid var(--flap-border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 700;
  }
  .card .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .card .row .k { color: var(--text-dim); }
  .card .row .v { font-family: 'Share Tech Mono', monospace; direction: ltr; unicode-bidi: isolate; }
  .card .row .v.long { color: var(--green); }
  .card .row .v.short { color: var(--red); }

  .summary-text {
    font-size: 15px;
    line-height: 2;
    color: var(--text);
  }

  .fund-bias select, .fund-bias textarea {
    width: 100%;
    background: var(--panel-bg-2);
    border: 1px solid var(--flap-border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    margin-top: 6px;
  }
  .fund-bias textarea { resize: vertical; min-height: 50px; }
  .fund-bias .note {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.6;
  }

  .back-link {
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
    align-self: flex-start;
  }
  .back-link:hover { color: var(--amber); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--flap-border); border-radius: 4px; }
</style>
</head>
<body>
  <div class="sidebar-toggle" id="sidebarToggle">&#9776;</div>

  <div class="app">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">FX LIVE BOARD</span>
      </div>
      <ul class="nav-list" id="navList">
        <li class="nav-item board-link" data-view="board">&#128202; Board (همه جفت‌ارزها)</li>
        <li class="nav-item account-link" data-view="account">&#128176; حساب و پوزیشن‌ها</li>
        <li class="nav-item fenefx-link" data-view="fenefx">&#129504; FeneFX AI <span class="separate-badge">مجزا</span></li>
      </ul>
    </nav>

    <main class="main" id="main"></main>
  </div>

<script>
  const SYMBOLS = ["XAUUSD.","GBPCAD.","USDCAD.","EURCAD.","GBPUSD.","USDJPY.","EURJPY.","USDCHF.","EURGBP.","EURUSD.","CADJPY.","GBPJPY."];
  const state = { view: "board", symbol: null, lastPrices: {}, chart: null, series: null };

  function displayName(symbol) { return symbol.replace(/\.+$/, ''); }
  function decimalsFor(symbol) {
    return symbol.toUpperCase().includes('JPY') ? 3 : (symbol.toUpperCase().startsWith('XAU') ? 2 : 5);
  }

  // ---------------- Sidebar ----------------

  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

  const navList = document.getElementById('navList');
  for (const symbol of SYMBOLS) {
    const li = document.createElement('li');
    li.className = 'nav-item';
    li.dataset.view = 'detail';
    li.dataset.symbol = symbol;
    li.innerHTML = `<span>${displayName(symbol)}</span><span class="nav-bias neutral" data-bias>--</span>`;
    li.addEventListener('click', () => navigate('detail', symbol));
    navList.appendChild(li);
  }
  navList.querySelector('.board-link').addEventListener('click', () => navigate('board'));
  navList.querySelector('.account-link').addEventListener('click', () => navigate('account'));
  navList.querySelector('.fenefx-link').addEventListener('click', () => navigate('fenefx'));

  function setActiveNav() {
    navList.querySelectorAll('.nav-item').forEach(el => {
      const isActive = state.view === 'board' ? el.classList.contains('board-link')
        : state.view === 'account' ? el.classList.contains('account-link')
        : state.view === 'fenefx' ? el.classList.contains('fenefx-link')
        : (el.dataset.symbol === state.symbol);
      el.classList.toggle('active', isActive);
    });
  }

  // ---------------- Routing ----------------

  const main = document.getElementById('main');

  function navigate(view, symbol, skipHash) {
    state.view = view;
    state.symbol = symbol || null;
    setActiveNav();
    if (view === 'board') renderBoard();
    else if (view === 'account') renderAccount();
    else if (view === 'fenefx') renderFenefx();
    else renderDetail(symbol);
    if (!skipHash) {
      location.hash = view === 'board' ? '' : view === 'account' ? 'account' : view === 'fenefx' ? 'fenefx' : `symbol=${encodeURIComponent(symbol)}`;
    }
  }

  function routeFromHash() {
    const hash = location.hash.replace(/^#/, '');
    if (hash === 'account') { navigate('account', null, true); return; }
    if (hash === 'fenefx') { navigate('fenefx', null, true); return; }
    const match = hash.match(/^symbol=(.+)$/);
    if (match) {
      const symbol = decodeURIComponent(match[1]);
      if (SYMBOLS.includes(symbol)) { navigate('detail', symbol, true); return; }
    }
    navigate('board', null, true);
  }
  window.addEventListener('hashchange', routeFromHash);

  // ---------------- Board view ----------------

  function renderBoard() {
    main.innerHTML = `
      <div class="header"><span class="status-dot" id="statusDot"></span><span id="statusText">CONNECTING</span><span class="title">FX LIVE BOARD</span></div>
      <div class="panel">
        <table dir="ltr">
          <thead><tr><th>Symbol</th><th class="num">Bid</th><th class="num">Ask</th><th class="num">Spread</th><th class="num">Updated</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="footer">Login 62406 &middot; Mondtrades-Server &middot; Mond Trades Ltd.</div>
    `;
    const rowsEl = document.getElementById('rows');
    for (const symbol of SYMBOLS) {
      const tr = document.createElement('tr');
      tr.dataset.symbol = symbol;
      tr.innerHTML = `
        <td class="symbol">${displayName(symbol)}</td>
        <td class="num bid" data-field="bid">--</td>
        <td class="num ask" data-field="ask">--</td>
        <td class="num spread" data-field="spread">--</td>
        <td class="num time" data-field="time">--:--:--</td>
      `;
      tr.addEventListener('click', () => navigate('detail', symbol));
      rowsEl.appendChild(tr);
      if (state.lastPrices[symbol]) paintBoardRow(state.lastPrices[symbol]);
    }
    reflectConnection();
  }

  function flash(cell, up) {
    cell.classList.remove('flash-up', 'flash-down');
    void cell.offsetWidth;
    cell.classList.add(up ? 'flash-up' : 'flash-down');
  }

  function paintBoardRow(entry) {
    const tr = document.querySelector(`#rows tr[data-symbol="${CSS.escape(entry.symbol)}"]`);
    if (!tr) return;
    const dec = decimalsFor(entry.symbol);
    const prev = state.lastPrices[entry.symbol];
    if (typeof entry.bid === 'number') {
      const cell = tr.querySelector('[data-field="bid"]');
      cell.textContent = entry.bid.toFixed(dec);
      if (prev && prev.bid !== undefined && entry.bid !== prev.bid) flash(cell, entry.bid > prev.bid);
    }
    if (typeof entry.ask === 'number') {
      const cell = tr.querySelector('[data-field="ask"]');
      cell.textContent = entry.ask.toFixed(dec);
      if (prev && prev.ask !== undefined && entry.ask !== prev.ask) flash(cell, entry.ask > prev.ask);
    }
    if (typeof entry.bid === 'number' && typeof entry.ask === 'number') {
      tr.querySelector('[data-field="spread"]').textContent = (entry.ask - entry.bid).toFixed(dec);
    }
    if (entry.time) {
      tr.querySelector('[data-field="time"]').textContent = new Date(entry.time * 1000).toLocaleTimeString('en-GB');
    }
  }

        </div>
        <div class="info-grid">
          <div class="card" id="setupCard"><h3>وضعیت ستاپ (لایه ۵)</h3><div id="setupBody">در حال بارگذاری...</div></div>
          <div class="card" id="dailyCard"><h3>بایاس روزانه (لایه ۳)</h3><div id="dailyBody">در حال بارگذاری...</div></div>
          <div class="card fund-bias"><h3>بایاس هفتگی فاندامنتال (لایه ۱ — دستی)</h3>
            <select id="fundBiasSelect">
              <option value="bullish">صعودی</option>
              <option value="bearish">نزولی</option>
              <option value="neutral">خنثی</option>
            </select>
            <textarea id="fundBiasNote" placeholder="یادداشت تحلیل فاندامنتال / کامنتری بازار / COT..."></textarea>
            <div class="note">این بخش به‌صورت دستی وارد می‌شود — هنوز به تقویم اقتصادی، بیانیه بانک مرکزی یا داده COT به‌صورت خودکار متصل نیست.</div>
          </div>
          <div class="card"><h3>خلاصه تحلیل و پیش‌بینی</h3><div class="summary-text" id="summaryText">در حال بارگذاری...</div></div>
        </div>
      </div>
    `;
    document.getElementById('backLink').addEventListener('click', () => navigate('board'));
    reflectConnection();

    if (!state.timeframe) state.timeframe = '5m';
    const tfRow = document.getElementById('tfRow');
    for (const tf of TIMEFRAMES) {
      const btn = document.createElement('button');
      btn.className = 'tf-btn' + (tf.key === state.timeframe ? ' active' : '');
      btn.textContent = tf.label;
      btn.addEventListener('click', () => {
        state.timeframe = tf.key;
        tfRow.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadAnalysis(symbol);
      });
      tfRow.appendChild(btn);
    }

    const fb = loadFundBias(symbol);
    const sel = document.getElementById('fundBiasSelect');
    const note = document.getElementById('fundBiasNote');
    sel.value = fb.bias;
    note.value = fb.note;
    sel.addEventListener('change', () => saveFundBias(symbol, { bias: sel.value, note: note.value }));
    note.addEventListener('input', () => saveFundBias(symbol, { bias: sel.value, note: note.value }));

    const chartEl = document.getElementById('chart');
    const chart = LightweightCharts.createChart(chartEl, {
      layout: { background: { color: '#14181d' }, textColor: '#9aa4b0' },
      grid: { vertLines: { color: '#1c2128' }, horzLines: { color: '#1c2128' } },
      rightPriceScale: { borderColor: '#2a313b' },
      timeScale: { borderColor: '#2a313b', timeVisible: true, secondsVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      autoSize: true,
    });
    const series = chart.addCandlestickSeries({
      upColor: '#33d17a', downColor: '#ff5c5c',
      borderUpColor: '#33d17a', borderDownColor: '#ff5c5c',
      wickUpColor: '#33d17a', wickDownColor: '#ff5c5c',
    });
    state.chart = chart;
    state.series = series;

    loadAnalysis(symbol);
    if (state.analysisTimer) clearInterval(state.analysisTimer);
    state.analysisTimer = setInterval(() => { if (state.view === 'detail' && state.symbol === symbol) loadAnalysis(symbol); }, 20000);
  }

  async function loadAnalysis(symbol) {
    try {
      const tf = state.timeframe || '5m';
      const res = await fetch(`/api/analysis/${encodeURIComponent(symbol)}?tf=${encodeURIComponent(tf)}`);
      const data = await res.json();
      if (state.view !== 'detail' || state.symbol !== symbol || (state.timeframe || '5m') !== tf) return;
      paintAnalysis(symbol, data);
    } catch (e) {
      console.error('analysis load failed', e);
    }
  }

  function biasBadgeHtml(label, value) {
    return `<div class="badge ${value}"><span>${label}</span><b>${BIAS_FA[value] || value}</b></div>`;
  }

  function paintAnalysis(symbol, data) {
    const dec = decimalsFor(symbol);

    // Sidebar bias tag
    const navBias = navList.querySelector(`.nav-item[data-symbol="${CSS.escape(symbol)}"] [data-bias]`);
    if (navBias) {
      navBias.textContent = BIAS_FA[data.h4_bias] || '--';
      navBias.className = 'nav-bias ' + (data.h4_bias || 'neutral');
    }

    // Badges
    const kz = data.kill_zone || {};
    document.getElementById('badgeRow').innerHTML = `
      ${biasBadgeHtml('H4 ساختار', data.h4_bias)}
      ${biasBadgeHtml('روزانه ساختار', data.daily_structure_bias)}
      <div class="badge kz"><span>Kill Zone (NY ${kz.ny_time || '--'})</span><b>${kz.label || '--'}</b></div>
    `;

    // Chart candles
    const candles = (data.candles || []).map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }));
    state.series.setData(candles);
    state.lastCandle = candles.length ? { ...candles[candles.length - 1] } : null;
    state.candleTf = data.timeframe;
    if (state._priceLines) state._priceLines.forEach(pl => state.series.removePriceLine(pl));
    state._priceLines = [];

    const addLine = (price, color, title, style) => {
      if (price === undefined || price === null) return;
      const pl = state.series.createPriceLine({
        price, color, lineWidth: 1,
        lineStyle: style ?? LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true, title,
      });
      state._priceLines.push(pl);
    };

    const setup = data.setup || {};
    const markers = [];

    if (setup.sweep) {
      addLine(setup.sweep.price, '#33d17a', 'Sweep');
      markers.push({ time: setup.sweep.time, position: setup.sweep.direction === 'bullish' ? 'belowBar' : 'aboveBar', color: '#33d17a', shape: setup.sweep.direction === 'bullish' ? 'arrowUp' : 'arrowDown', text: 'SWEEP' });
    }
    if (setup.mss) {
      addLine(setup.mss.price, '#ffb020', 'MSS');
      markers.push({ time: setup.mss.time, position: setup.mss.direction === 'bullish' ? 'belowBar' : 'aboveBar', color: '#ffb020', shape: 'circle', text: 'MSS' });
    }
    if (setup.order_block) {
      addLine(setup.order_block.high, '#c084fc', 'OB high', LightweightCharts.LineStyle.Dotted);
      addLine(setup.order_block.low, '#c084fc', 'OB low', LightweightCharts.LineStyle.Dotted);
    }
    if (setup.fvg) {
      addLine(setup.fvg.top, '#f472b6', 'FVG top', LightweightCharts.LineStyle.Dotted);
      addLine(setup.fvg.bottom, '#f472b6', 'FVG bottom', LightweightCharts.LineStyle.Dotted);
    }
    if (setup.ote) {
      addLine(setup.ote.top, '#4da3ff', 'OTE 61.8%', LightweightCharts.LineStyle.Dotted);
      addLine(setup.ote.bottom, '#4da3ff', 'OTE 79%', LightweightCharts.LineStyle.Dotted);
    }
    if (setup.state === 'setup_ready') {
      addLine(setup.entry, '#33d17a', 'ENTRY', LightweightCharts.LineStyle.Solid);
      addLine(setup.stop_loss, '#ff5c5c', 'SL', LightweightCharts.LineStyle.Solid);
      addLine(setup.take_profit, '#4da3ff', 'TP', LightweightCharts.LineStyle.Solid);
    }
    state.series.setMarkers(markers);

    // Setup card
    let setupHtml = `<p class="summary-text" style="margin:0 0 10px;font-size:14px;">${STATE_FA[setup.state] || setup.state}</p>`;
    if (setup.direction) {
      setupHtml += `<div class="row"><span class="k">جهت</span><span class="v ${setup.direction === 'bullish' ? 'long' : 'short'}">${BIAS_FA[setup.direction]}</span></div>`;
    }
    if (setup.state === 'setup_ready') {
      setupHtml += `
        <div class="row"><span class="k">Unicorn (OB+FVG هم‌پوشان)</span><span class="v">${setup.unicorn ? 'بله' : 'خیر'}</span></div>
        <div class="row"><span class="k">Entry</span><span class="v">${setup.entry.toFixed(dec)}</span></div>
        <div class="row"><span class="k">Stop Loss</span><span class="v short">${setup.stop_loss.toFixed(dec)}</span></div>
        <div class="row"><span class="k">Take Profit</span><span class="v long">${setup.take_profit.toFixed(dec)}</span></div>
        <div class="row"><span class="k">Risk:Reward</span><span class="v">1:${setup.risk_reward ?? '--'}</span></div>
      `;
    }
    document.getElementById('setupBody').innerHTML = setupHtml;

    // Daily bias card
    const db = data.daily_bias || {};
    document.getElementById('dailyBody').innerHTML = `
      <div class="row"><span class="k">Prev Day High</span><span class="v">${db.prev_day_high?.toFixed(dec) ?? '--'}</span></div>
      <div class="row"><span class="k">Prev Day Low</span><span class="v">${db.prev_day_low?.toFixed(dec) ?? '--'}</span></div>
      <div class="row"><span class="k">Sweep High/Low قبلی</span><span class="v">${db.swept_prev_high ? 'High زده شد' : (db.swept_prev_low ? 'Low زده شد' : 'هنوز نه')}</span></div>
      <div class="row"><span class="k">Asia Range</span><span class="v">${db.asia_low?.toFixed(dec) ?? '--'} - ${db.asia_high?.toFixed(dec) ?? '--'}</span></div>
      <div class="row"><span class="k">Daily Open</span><span class="v">${db.daily_open?.toFixed(dec) ?? '--'}</span></div>
    `;

    // Summary / forecast text
    let summary = `بایاس H4: <b>${BIAS_FA[data.h4_bias]}</b> — ساختار روزانه: <b>${BIAS_FA[data.daily_structure_bias]}</b> — ${kz.label !== 'Out of Kill Zone' ? `اکنون داخل Kill Zone <b>${kz.label}</b> هستیم.` : 'اکنون خارج از Kill Zone اصلی هستیم؛ سیگنال‌ها اعتبار کمتری دارند.'}<br>`;
    summary += STATE_FA[setup.state] || '';
    if (setup.state === 'setup_ready') {
      const dirFa = setup.direction === 'bullish' ? 'صعودی' : 'نزولی';
      summary += `<br>پیش‌بینی: در صورت واکنش قیمت به ناحیه OTE (فیبو ۶۱.۸٪-۷۹٪ حرکت Displacement)، انتظار حرکت <b>${dirFa}</b> به سمت ${setup.take_profit.toFixed(dec)} با نسبت ریسک‌به‌ریوارد 1:${setup.risk_reward ?? '--'} می‌رود.`;
      if (setup.unicorn) summary += ' هم‌پوشانی Order Block و FVG (الگوی Unicorn) اعتبار این ناحیه را بالاتر می‌برد.';
    }
    document.getElementById('summaryText').innerHTML = summary;
  }

  // ---------------- Live updates for the open detail view ----------------

  function updateLivePriceRow(entry) {
    const bidEl = document.getElementById('livePriceBid');
    if (!bidEl) return;
    const dec = decimalsFor(entry.symbol);
    const prev = state.lastPrices[entry.symbol];

    if (typeof entry.bid === 'number') {
      bidEl.textContent = entry.bid.toFixed(dec);
      if (prev && prev.bid !== undefined && entry.bid !== prev.bid) flash(bidEl, entry.bid > prev.bid);
    }
    const askEl = document.getElementById('livePriceAsk');
    if (typeof entry.ask === 'number') {
      askEl.textContent = entry.ask.toFixed(dec);
      if (prev && prev.ask !== undefined && entry.ask !== prev.ask) flash(askEl, entry.ask > prev.ask);
    }
    if (typeof entry.bid === 'number' && typeof entry.ask === 'number') {
      document.getElementById('livePriceSpread').textContent = (entry.ask - entry.bid).toFixed(dec);
    }
    if (entry.time) {
      document.getElementById('livePriceTime').textContent = new Date(entry.time * 1000).toLocaleTimeString('en-GB');
    }
  }

  function updateLiveCandle(entry) {
    if (!state.series || !state.lastCandle || !state.candleTf || typeof entry.bid !== 'number' || !entry.time) return;
    const intervalSec = TIMEFRAME_SECONDS[state.candleTf];
    if (!intervalSec) return;
    const bucket = Math.floor(entry.time / intervalSec) * intervalSec;
    const price = entry.bid;
    const c = state.lastCandle;

    if (bucket === c.time) {
      c.high = Math.max(c.high, price);
      c.low = Math.min(c.low, price);
      c.close = price;
      state.series.update(c);
    } else if (bucket > c.time) {
      const next = { time: bucket, open: price, high: price, low: price, close: price };
      state.series.update(next);
      state.lastCandle = next;
    }
  }

  // ---------------- WebSocket price feed ----------------

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => { state.connected = true; reflectConnection(); };
    ws.onclose = () => { state.connected = false; reflectConnection(); setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'prices') {
        state.connected = true;
        reflectConnection();
        for (const entry of data.symbols) {
          if (state.view === 'board') {
            paintBoardRow(entry);
          } else if (state.view === 'detail' && state.symbol === entry.symbol) {
            updateLivePriceRow(entry);
            updateLiveCandle(entry);
          }
          state.lastPrices[entry.symbol] = entry;
        }
      } else if (data.type === 'status') {
        state.connected = !!data.connected;
        reflectConnection();
      }
    };
  }

  routeFromHash();
  connect();
</script>
</body>
</html>
