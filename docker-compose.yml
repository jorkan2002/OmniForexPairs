services:
  # Nginx serves the static "notice board" dashboard and reverse-proxies
  # /api and /ws to the MT5 bridge, which runs natively on the Windows host
  # (windows-bridge/) - not in Docker, since MT5 needs the real terminal.
  # Also proxies /fenefx-api to the fenefx-engine service below.
  frontend:
    build: ./frontend
    container_name: mt5-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - fenefx-engine

  # Local LLM runtime (Ollama), containerized so the whole FeneFX AI stack
  # is portable. Runs CPU-only here (no usable AMD GPU passthrough on this
  # machine); add a `deploy.resources.reservations.devices` GPU block if
  # this is deployed on a machine with an NVIDIA GPU later.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # FeneFX AI signal engine - fully separate from the sweep-strategy bot
  # in windows-bridge/. Talks to windows-bridge over HTTP for price data
  # (no direct MT5 access), calls whichever LLM provider is selected, and
  # posts its own Telegram signals tagged "FeneFX AI".
  fenefx-engine:
    build: ./fenefx-engine
    container_name: fenefx-engine
    env_file: .env
    environment:
      WINDOWS_BRIDGE_URL: http://host.docker.internal:8000
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
    ports:
      - "8010:8010"
    depends_on:
      - ollama
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_data:
